<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Turno y Calculadora WiWANG</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="Logo wiwang.PNG">
    <style>
        
    body {
            background-image: url('logo fondo.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .hidden {
            display: none;
        }
    </style>
</head>

<body class="bg-opacity-90">
    <!-- Sección de Inicio de Turno -->
    <div id="inicio-turno">
        <div class="bg-gradient-to-r from-cyan-500 via-blue-500 to-pink-500 py-4 rounded-b-lg shadow-lg border-b-4 border-cyan-400 mb-6">
            <div class="max-w-2xl mx-auto px-4 bg-black/60 rounded">
                <h1 class="text-3xl md:text-4xl font-extrabold text-white drop-shadow-lg tracking-wide uppercase animate-pulse text-center py-2">
                    Inicio de Turno <span class="text-pink-300">Wiwang</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center justify-center min-h-screen py-8">
            <form id="turno-form" class="bg-black text-pink-400 shadow-lg rounded-lg p-6 max-w-md w-full border border-pink-400">
                <div class="mb-4">
                    <label for="mesero-nombre" class="block text-lg font-semibold">Nombre del Mesero:</label>
                    <input
                        type="text"
                        id="mesero-nombre"
                        class="border border-pink-400 rounded w-full px-3 py-2 bg-black text-pink-400 placeholder-pink-300 focus:outline-none focus:ring-2 focus:ring-pink-400"
                        placeholder="Ingresa tu nombre"
                        required
                    >
                </div>
                <div class="mb-4">
                    <label for="mesero-rango" class="block text-lg font-semibold">Rango:</label>
                    <select
                        id="mesero-rango"
                        class="border border-pink-400 rounded w-full px-3 py-2 bg-black text-pink-400 focus:outline-none focus:ring-2 focus:ring-pink-400"
                        required
                    >
                        <option value="">Selecciona un rango</option>
                        <option value="Bartender">Bartender</option>
                    </select>
                </div>
                <!-- Botón Entrar al Turno -->
                <button type="submit" class="bg-black text-pink-400 px-4 py-2 rounded w-full border border-pink-400">Entrar al Turno</button>
            </form>
        </div>
    </div>

    <!-- Sección de Calculadora -->
    <div id="calculadora" class="hidden">
        <!-- Título con franja  -->
        >
        <div class="bg-gradient-to-r from-cyan-500 via-blue-500 to-pink-500 py-4 rounded-b-lg shadow-lg border-b-4 border-cyan-400 mb-6">
            <div class="max-w-2xl mx-auto px-4 bg-black/60 rounded">
                <h1 class="text-4xl font-extrabold text-white drop-shadow-lg tracking-wide uppercase animate-pulse text-center py-2">
                    Calculadora <span class="text-pink-300">Wiwang</span>
                </h1>
            </div>
        </div>

        <!-- Notificaciones -->
        <div id="notification" class="hidden fixed top-5 right-5 bg-green-600 text-white px-4 py-2 rounded shadow-lg">
            <p id="notification-message"></p>
        </div>

        <!-- Contenido principal -->
        <div class="container mx-auto py-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <!-- Comestibles -->
                <div>
                    <h2 class="text-2xl font-semibold text-pink-400 mb-4 bg-black p-2 rounded text-center border border-pink-400">Comestibles</h2>
                    <div id="comestibles" class="grid gap-4"></div>
                </div>

                <!-- Bebestibles -->
                <div>
                    <h2 class="text-2xl font-semibold text-pink-400 mb-4 bg-black p-2 rounded text-center border border-pink-400">Bebestibles</h2>
                    <div id="bebestibles" class="grid gap-4"></div>
                </div>

                <!-- Cajas -->
                <div>
                    <h2 class="text-2xl font-semibold text-pink-400 mb-4 bg-black p-2 rounded text-center border border-pink-400">Cajas</h2>
                    <div id="cajas" class="grid gap-4"></div>
                </div>

                <!-- Carrito -->
                <div>
                    <h2 class="text-2xl font-semibold text-pink-400 mb-4 bg-black p-2 rounded text-center border border-pink-400">Carrito</h2>
                    <div class="bg-black text-pink-400 shadow-lg rounded-lg p-6">
                        <div id="cart-items" class="space-y-4"></div>
                        <p class="text-lg bg-black text-pink-400 p-2 rounded">Total: $<span id="cart-total">0</span></p>
                        <div class="space-y-2 mt-4">
                            <!-- Botón Registrar Venta -->
                            <button id="register-sale" class="bg-black text-pink-400 px-4 py-2 rounded w-full border border-pink-400">Registrar Venta</button>
                            <button id="clear-cart" class="bg-black text-white px-4 py-2 rounded w-full border border-pink-400">Vaciar Carrito</button>
                            <button id="close-turno" class="bg-black text-red-500 px-4 py-2 rounded w-full border border-pink-400">Cerrar Turno</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p id="miElemento" class="text-pink-400 text-center mt-2"></p>
    <script>
        const turnoForm = document.getElementById("turno-form");
        const calculadoraSection = document.getElementById("calculadora");
        const inicioTurnoSection = document.getElementById("inicio-turno");
        const cartItems = document.getElementById("cart-items");
        const cartTotal = document.getElementById("cart-total");
        const notification = document.getElementById("notification");
        const notificationMessage = document.getElementById("notification-message");

        let cart = [];
        let salesHistory = JSON.parse(localStorage.getItem("salesHistory")) || [];

        turnoForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const nombre = document.getElementById("mesero-nombre").value;
            const rango = document.getElementById("mesero-rango").value;
            const entrada = new Date();

            localStorage.setItem("mesero", JSON.stringify({ nombre, rango, entrada }));
            inicioTurnoSection.classList.add("hidden");
            calculadoraSection.classList.remove("hidden");
            generateProducts();
        });

        function showNotification(message) {
            notificationMessage.textContent = message;
            notification.classList.remove("hidden");
            setTimeout(() => notification.classList.add("hidden"), 3000);
        }

        function updateCart() {
            cartItems.innerHTML = "";
            let total = 0;
            cart.forEach(item => {
                total += item.cantidad * item.precio;
                const div = document.createElement("div");
                div.textContent = `${item.nombre} x${item.cantidad} - $${item.cantidad * item.precio}`;
                cartItems.appendChild(div);
            });
            cartTotal.textContent = total;
        }

        document.getElementById("clear-cart").addEventListener("click", () => {
            cart = [];
            updateCart();
            showNotification("Carrito vaciado.");
        });

        document.getElementById("register-sale").addEventListener("click", () => {
            if (cart.length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            salesHistory.push([...cart]);
            localStorage.setItem("salesHistory", JSON.stringify(salesHistory));
            showNotification("Venta registrada con éxito.");

            // Guardar tiempo en servicio
            const turno = JSON.parse(localStorage.getItem("mesero"));
            if (turno) {
                const ahora = new Date();
                const entrada = new Date(turno.entrada);
                const tiempoMs = ahora - entrada;
                localStorage.setItem("tiempoServicio", tiempoMs);
            }

            cart = [];
            updateCart();
        });

        document.getElementById("close-turno").addEventListener("click", () => {
            const turno = JSON.parse(localStorage.getItem("mesero"));
            if (!turno) {
                alert("No hay un turno activo.");
                return;
            }
            const salida = new Date();
            const entrada = new Date(turno.entrada);
            const horas = Math.floor((salida - entrada) / 3600000);
            const minutos = Math.floor(((salida - entrada) % 3600000) / 60000);

            let totalVentas = 0;
            let ventasTexto = `Detalles del Turno\n\nNombre: ${turno.nombre}\nRango: ${turno.rango}\nEntrada: ${entrada.toLocaleString()}\nSalida: ${salida.toLocaleString()}\nTiempo en Turno: ${horas} horas y ${minutos} minutos\n`;

            salesHistory.forEach((venta, i) => {
                let subtotal = 0;
                ventasTexto += `\nVenta ${i + 1}:\n`;
                venta.forEach(item => {
                    const itemTotal = item.cantidad * item.precio;
                    subtotal += itemTotal;
                    ventasTexto += `- ${item.nombre} x${item.cantidad}: $${itemTotal}\n`;
                });
                totalVentas += subtotal;
                ventasTexto += `Subtotal: $${subtotal}\n`;
            });

            ventasTexto += `\nTotal de Ventas: $${totalVentas}`;

            const blob = new Blob([ventasTexto], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "turno wiwang.txt";
            link.click();

            localStorage.removeItem("mesero");
            localStorage.removeItem("salesHistory");
            window.location.reload();
        });

        const productos = [
            { id: 1, tipo: "comestible", nombre: "Shin Ramyun", precio: 1000, imagen: "Shin Ramyun.png" },
            { id: 2, tipo: "comestible", nombre: "Rosé Tteokbokki", precio: 1000, imagen: "Rosé Tteokbokki.png" },
            { id: 3, tipo: "comestible", nombre: "Kimchi Jeon", precio: 1000, imagen: "Kimchi Jeon.png" },
            { id: 4, tipo: "comestible", nombre: "Dakganjeong", precio: 1000, imagen: "Dakganjeong.png" },
            { id: 5, tipo: "comestible", nombre: "Sotteok", precio: 1000, imagen: "Sotteok.png" },
            { id: 6, tipo: "comestible", nombre: "Gamja Hotdog", precio: 1000, imagen: "Gamja Hotdog.png" },
            { id: 7, tipo: "comestible", nombre: "Galbi", precio: 1000, imagen: "Galbi.png" },
            { id: 8, tipo: "bebestible", nombre: "Soju de Melocotón", precio: 1000, imagen: "Soju de Melocotón.png" },
            { id: 9, tipo: "bebestible", nombre: "Soju de Uva", precio: 1000, imagen: "Soju de Uva.png" },
            { id: 10, tipo: "bebestible", nombre: "Maekju (cerveza)", precio: 1000, imagen: "Maekju.png" },
            { id: 10, tipo: "bebestible", nombre: "Promo Tragos 2x1 ", precio: 1000, imagen: "2x1.png" },
            { id: 12, tipo: "bebestible", nombre: "Milkis (soda) Sin Alcohol", precio: 1000, imagen: "Milkis.png" },
            { id: 13, tipo: "bebestible", nombre: "Leche de plátano Sin Alcohol", precio: 1000, imagen: "Leche de plátano.png" },
            { id: 14, tipo: "bebestible", nombre: "Café Dalgona Sin Alcohol", precio: 1000, imagen: "Café Dalgona.png" },
            { id: 15, tipo: "Caja ", nombre: "Caja 3 x 3", precio: 5000, imagen: "Caja.png" },
            { id: 16, tipo: "Caja ", nombre: "Caja 12 x 12", precio: 20000, imagen: "Caja.png" },
            { id: 17, tipo: "Caja ", nombre: "Caja Miku (4x4x4) + Coleccionable ", precio: 15000, imagen: "BOLSA.png" },
   
          
        ];

        function generateProducts() {
            productos.forEach(product => {
                const div = document.createElement("div");
                div.className = "bg-black text-pink-400 shadow-lg rounded-lg p-4 flex items-center border border-pink-400";
                div.innerHTML = `
                    <img src="${product.imagen}" alt="${product.nombre}" class="w-12 h-12 mr-4">
                    <div class="flex-1">
                        <p class="text-xl font-bold">${product.nombre}</p>
                        <p class="text-lg text-pink-200">Precio: $${product.precio}</p>
                        <div class="flex items-center space-x-4 mt-2">
                            <button class="bg-black text-pink-400 px-2 py-1 rounded border border-pink-400 decrease">-</button>
                            <input type="number" value="1" min="1" class="quantity-input bg-black text-pink-400 border border-pink-400 rounded w-12 text-center" />
                            <button class="bg-black text-pink-400 px-2 py-1 rounded border border-pink-400 increase">+</button>
                        </div>
                    </div>
                    <button class="bg-black text-white px-4 py-2 rounded ml-4 border border-pink-400 add-to-cart">Añadir</button>
                `;

                const quantityInput = div.querySelector(".quantity-input");
                const decreaseBtn = div.querySelector(".decrease");
                const increaseBtn = div.querySelector(".increase");
                const addToCartBtn = div.querySelector(".add-to-cart");

                decreaseBtn.addEventListener("click", () => {
                    quantityInput.value = Math.max(1, parseInt(quantityInput.value) - 1);
                });

                increaseBtn.addEventListener("click", () => {
                    quantityInput.value = parseInt(quantityInput.value) + 1;
                });

                addToCartBtn.addEventListener("click", () => {
                    addToCart(product, parseInt(quantityInput.value));
                    showNotification(`${product.nombre} añadido al carrito.`);
                });

                let container = "bebestibles";
                if (product.tipo === "comestible") container = "comestibles";
                else if (product.tipo.trim().toLowerCase() === "caja") container = "cajas";
                document.getElementById(container).appendChild(div);
            });
        }

        function addToCart(product, cantidad) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.cantidad += cantidad;
            } else {
                cart.push({ ...product, cantidad });
            }
            updateCart();
        }

        const tiempoServicio = localStorage.getItem("tiempoServicio");
        if (tiempoServicio) {
            const horas = Math.floor(tiempoServicio / 3600000);
            const minutos = Math.floor((tiempoServicio % 3600000) / 60000);
            // Muestra donde quieras, por ejemplo:
            // document.getElementById("miElemento").textContent = `Tiempo en servicio: ${horas}h ${minutos}m`;
        }

        // Actualiza y guarda el tiempo en servicio en tiempo real si hay turno activo
        const turnoActivo = JSON.parse(localStorage.getItem("mesero"));
        if (turnoActivo) {
            function actualizarTiempoServicio() {
                const entrada = new Date(turnoActivo.entrada);
                const ahora = new Date();
                const tiempoMs = ahora - entrada;
                localStorage.setItem("tiempoServicio", tiempoMs);

                // (Opcional) Mostrar en pantalla:
                // const horas = Math.floor(tiempoMs / 3600000);
                // const minutos = Math.floor((tiempoMs % 3600000) / 60000);
                // document.getElementById("miElemento").textContent = `Tiempo en servicio: ${horas}h ${minutos}m`;
            }
            actualizarTiempoServicio();
            setInterval(actualizarTiempoServicio, 60000); // Actualiza cada minuto
        }
    </script>
</body>

</html>
